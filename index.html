    function ProjectCard({ project }) {

            <div className="project-topline">
              <span className="project-status">{project.status || 'Project'}</span>
              <span className="project-role">{project.role || 'Game Developer'}</span>
            </div>

            <div className="project-tags">
              {tags.map((tag) => (
                <span key={tag}>{tag}</span>
              ))}
            </div>

            <p>{project.description}</p>

            {project.focus && (
              <div className="project-focus">

                <span>{project.focus}</span>
              </div>
            )}

            {contributions.length > 0 && (
              <ul>

    function Contact() {
      const [formData, setFormData] = useState({
        name: '',
        email: '',
        subject: '',
        message: '',
      });

      function handleChange(e) {
        const { name, value } = e.target;
        setFormData((prev) => ({ ...prev, [name]: value }));
      }

      function handleSubmit(e) {
        e.preventDefault();

        const recipient = 'tiagorvmartins@gmail.com';
        const subject = encodeURIComponent(formData.subject);
        const body = encodeURIComponent(
          `Name: ${formData.name}\nEmail: ${formData.email}\n\n${formData.message}`
        );

        window.location.href = `mailto:${recipient}?subject=${subject}&body=${body}`;
      }

      return (
        <section className="section page-section">
          <div className="section-header">
            <p className="eyebrow">Contact</p>
            <h2>Contact Me</h2>
            <p className="section-subtitle">
              Want to collaborate, ask something, or see more of my work? Send me a message.
            </p>
          </div>

          <form className="contact-form" onSubmit={handleSubmit}>
            <input
              type="text"
              name="name"
              placeholder="Name"
              value={formData.name}
              onChange={handleChange}
              required
            />

            <input
              type="email"
              name="email"
              placeholder="Email"
              value={formData.email}
              onChange={handleChange}
              required
            />

            <input
              type="text"
              name="subject"
              placeholder="Subject"
              value={formData.subject}
              onChange={handleChange}
              required
            />

            <textarea
              name="message"
              placeholder="Message"
              rows="6"
              value={formData.message}
              onChange={handleChange}
              required
            ></textarea>

            <button type="submit" className="primary-btn">Send Message</button>
          </form>
        </section>
      );
    }
